<!doctype html>
<html lang="en">
    <head>
        <title>Quantile Exchange Rate Calculator</title>
    </head>
    <body>
        <h1>AUD Converter</h1>

        <label for="currency">Convert to</label>
        <select id="currency"></select>
        
        <label for="amount">Amount in AUD</label>
        <input id="amount" type="number" min="0" step="0.01" value="100">

        <button id="convert">Convert</button>

        <p id="result"></p>
        <p id="details"></p>


        <script>
            const select = document.querySelector("#currency");
            const amountInput = document.querySelector("#amount");
            const button = document.querySelector("#convert");
            const result = document.querySelector("#result");
            const details = document.querySelector("#details");
        
            // 1. On page load: fill the dropdown from our own API.
            async function loadCurrencies() {
            const response = await fetch("/api/currencies");
            const currencies = await response.json();
        
            for (const code in currencies) {
                const option = document.createElement("option");
                option.value = code;
                option.textContent = `${currencies[code].name} (${code})`;
                select.appendChild(option);
            }
            }
        
            // 2. On button click: ask our API to convert, then show the answer.
            async function convert() {
            const code = select.value;
            const amount = amountInput.value;
        
            result.className = "";
            result.textContent = "Converting…";
            details.textContent = "";
        
            const response = await fetch(`/api/convert?to=${code}&amount=${amount}`);
            const data = await response.json();
        
            if (!response.ok) {
                // FastAPI errors look like {"detail": "..."} (or a list for 422s).
                result.className = "error";
                result.textContent = typeof data.detail === "string" ? data.detail : "Please enter a valid amount.";
                return;
            }
        
            // 3. Show the result.
            const converted = data.result.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            result.textContent = `${data.amount} AUD = ${converted} ${data.to}`;
            details.textContent = `Rate ${data.rate}, as of ${data.date}`;
            }
        
            button.addEventListener("click", convert);
            loadCurrencies();
        </script>
    </body>
</html>
